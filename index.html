<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انگیزه روزانه | Daily Motivation</title>
    
    <!-- اتصال به فایل PWA (بعدا کاملش می‌کنیم) -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* استایل‌های کلی */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* کارت اصلی */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* محل نمایش جمله انگیزشی */
        #quote-text {
            font-size: 20px;
            line-height: 1.6;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        /* دکمه تغییر جمله */
        button {
            background: #ff7e5f;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* فوتر */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>✨ انگیزه روزانه ✨</h1>
        
        <!-- متن جمله اینجا قرار می‌گیرد -->
        <p id="quote-text">در حال بارگذاری...</p>
        
        <!-- دکمه تعویض -->
        <button onclick="getNewQuote()">یک جمله دیگر!</button>
    </div>

    <footer>ساخته شده با ❤️ برای رشد شما</footer>
<script>
    // ۱. لیست جملات انگیزشی (می‌توانید بعداً جمله اضافه کنید)
    const quotes = [
        "هر روز یک فرصت جدید برای شروع است.",
        "به خودت ایمان داشته باش، تو از آنچه فکر می‌کنی قوی‌تری.",
        "موفقیت از آن کسانی است که تسلیم نمی‌شوند.",
        "کوچک شروع کن، اما رؤیای بزرگ داشته باش.",
        "بهانه‌ها را کنار بگذار، امروز روز توست!",
        "پیشرفت، نتیجه تلاش‌های کوچک و مداوم است.",
        "ناامیدی پایان راه نیست، فقط یک پیچ است."
    ];

    // ۲. پیدا کردن عناصر صفحه
    const quoteElement = document.getElementById('quote-text');

    // ۳. تابع برای انتخاب و نمایش یک جمله تصادفی
    function getNewQuote() {
        // افکت محو شدن برای زیبایی
        quoteElement.style.opacity = 0;

        setTimeout(() => {
            // انتخاب یک عدد تصادفی از 0 تا تعداد جملات
            const randomIndex = Math.floor(Math.random() * quotes.length);
            
            // قرار دادن جمله در صفحه
            quoteElement.innerText = quotes[randomIndex];
            
            // افکت ظاهر شدن مجدد
            quoteElement.style.opacity = 1;
        }, 300); // 300 میلی‌ثانیه تاخیر
    }

    // ۴. اجرای اولیه هنگام باز شدن سایت
    window.onload = getNewQuote;
</script>
</body>
</html>
