 <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انگیزه روزانه | Daily Motivation</title>
    
    <!-- اتصال به فایل PWA -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* استایل‌های کلی */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }

        /* تعریف متغیرها برای حالت روشن (روز) */
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --btn-secondary-bg: rgba(255, 255, 255, 0.2);
        }

        /* تعریف متغیرها برای حالت تاریک (شب) */
        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --text-color: #e0e0e0;
            --card-bg: rgba(0, 0, 0, 0.4);
            --card-border: rgba(255, 255, 255, 0.1);
            --btn-secondary-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* کارت اصلی */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: background 0.5s ease, border 0.5s ease;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* محل نمایش جمله انگیزشی */
        #quote-text {
            font-size: 20px;
            line-height: 1.6;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        /* دکمه‌ها */
        button {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* دکمه‌های کپی و اشتراک‌گذاری */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: none;
            margin-top: 0;
            transition: background 0.3s;
        }

        /* دکمه تغییر تم */
        .theme-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 24px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 0;
        }

        /* فوتر */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- دکمه تغییر تم -->
    <button id="theme-toggle" class="theme-btn" title="تغییر حالت">🌙</button>

    <div class="card">
        <h1>✨ انگیزه روزانه ✨</h1>
        
        <p id="quote-text">در حال بارگذاری...</p>
        
        <button onclick="getNewQuote()">یک جمله دیگر!</button>

        <div class="action-buttons">
            <button class="btn-secondary" onclick="copyQuote()">📋 کپی</button>
            <button class="btn-secondary" onclick="shareQuote()">📤 اشتراک‌گذاری</button>
        </div>
    </div>

    <footer>ساخته شده با ❤️ برای رشد شما</footer>

    <script>
        // ۱. لیست ۱۰۰ جمله انگیزشی
        const quotes = [
            "هر روز یک فرصت جدید برای شروع است.",
            "به خودت ایمان داشته باش، تو از آنچه فکر می‌کنی قوی‌تری.",
            "موفقیت از آن کسانی است که تسلیم نمی‌شوند.",
            "کوچک شروع کن، اما رؤیای بزرگ داشته باش.",
            "بهانه‌ها را کنار بگذار، امروز روز توست!",
            "پیشرفت، نتیجه تلاش‌های کوچک و مداوم است.",
            "ناامیدی پایان راه نیست، فقط یک پیچ است.",
            "تنها راه انجام کارهای بزرگ، عاشق شدن به کاری است که انجام می‌دهی.",
            "شکست، فرصتی دوباره برای شروع هوشمندانه‌تر است.",
            "آرام باش و به مسیرت ادامه بده.",
            "تو مسئول کیفیت روزهایت هستی.",
            "هر قدم کوچک، تو را به هدفت نزدیک‌تر می‌کند.",
            "به گذشته فکر نکن، روی ساختن آینده تمرکز کن.",
            "بزرگ‌ترین ریسک، ریسک نکردن است.",
            "توانایی‌هایت را باور کن، معجزه اتفاق می‌افتد.",
            "امروز بهترین روز برای شروع دوباره است.",
            "از منطقه امن خودت خارج شو، رشد آنجاست.",
            "هر روز تلاش کن یک درصد بهتر از دیروز باشی.",
            "ذهنیتت را تغییر بده تا زندگیت تغییر کند.",
            "سختی‌ها تو را قوی‌تر می‌کنند.",
            "هیچ‌وقت برای شروع دیر نیست.",
            "هدف داشته باش و برای رسیدن به آن بجنگ.",
            "موفقیت یک مسیر است، نه یک مقصد.",
            "به جای ترس از شکست، از تلاش نکردن بترس.",
            "تو قوی‌تر از چیزی هستی که فکر می‌کنی.",
            "خودت را با هیچ‌کس مقایسه نکن، مسیر تو منحصر به فرد است.",
            "امروز کاری را انجام بده که آینده‌ات از تو تشکر کند.",
            "لبخند بزن، انرژی مثبت جذب کن.",
            "تغییرات بزرگ با قدم‌های کوچک شروع می‌شوند.",
            "هیچ‌وقت امیدت را از دست نده.",
            "بهترین نسخه از خودت باش.",
            "از اشتباهاتت درس بگیر، نه اینکه پشیمان باشی.",
            "زمانت را برای چیزهایی که اهمیت دارند صرف کن.",
            "مثبت فکر کن، نتیجه مثبت می‌گیری.",
            "زندگی زیباست، قدر لحظه‌ها را بدان.",
            "با خودت مهربان باش.",
            "هر روز یک هدیه است.",
            "به رویاهایت چنگ بزن.",
            "پیروزی از آن توست اگر باور داشته باشی.",
            "استقامت کن، پایان راه نزدیک است.",
            "هیچ چیز غیرممکن نیست.",
            "بهترین سرمایه‌گذاری، سرمایه‌گذاری روی خودت است.",
            "کتاب بخوان تا ذهنت رشد کند.",
            "ورزش کن تا انرژی‌ات بالا برود.",
            "زودتر از دیروز بیدار شو.",
            "برای اهدافت برنامه داشته باش.",
            "از چالش‌ها استقبال کن.",
            "اعتماد به نفس داشته باش.",
            "اراده تو تعیین‌کننده سرنوشتت است.",
            "هر روز شکرگزار چیزی باش.",
            "در لحظه حال زندگی کن.",
            "به دیگران کمک کن، شادی را تجربه می‌کنی.",
            "انتخاب‌های امروزت، زندگی فردایت را می‌سازند.",
            "از خودت یک تصویر بزرگ بساز.",
            "سکوت کن و درون خودت را بشنو.",
            "به ندای قلبت گوش کن.",
            "مسیر خودت را پیدا کن.",
            "هر شکستی، مقدمه‌ای برای پیروزی است.",
            "احساساتت را مدیریت کن.",
            "زمان خودت را با افراد مثبت پر کن.",
            "به انتقادات سازنده گوش کن.",
            "از انجام کارهای عالی خوشحال باش.",
            "شادی را در کارهای کوچک پیدا کن.",
            "مرزهایت را مشخص کن.",
            "به بدنت احترام بگذار.",
            "نفس عمیق بکش و آرام باش.",
            "بر روی حل مسئله تمرکز کن.",
            "از کاه کوه نساز.",
            "بهترین کارت را انجام بده و نتیجه را رها کن.",
            "سپاسگزار کوچک‌ترین نعمت‌ها باش.",
            "ذوق و شوق را در خودت زنده نگه دار.",
            "رویاهایت را یادداشت کن.",
            "برای دقایق ارزشمندت برنامه داشته باش.",
            "به خودت زمان بده.",
            "از هر مانعی، پلی بساز برای پیشرفت.",
            "باور داشته باش که شایسته بهترین‌ها هستی.",
            "مهربانی، قوی‌ترین سلاح است.",
            "به دلت اعتماد کن.",
            "خودت باش، دیگران همه جای تو را پر کرده‌اند.",
            "در زندگی، ببخش و بگذر.",
            "به جای حسرت، تلاش کن.",
            "امروز بهترین زمان برای شروع است.",
            "از خودت سبقت بگیر.",
            "بهترین‌ها برای کسانی است که برایشان تلاش می‌کنند.",
            "نگاهت را به افق‌های روشن بدوز.",
            "با هر نفسی، امیدی تازه در وجودت دمیده می‌شود.",
            "پرقدرت و ثابت قدم به جلو حرکت کن.",
            "هیچ طوفانی پایدار نیست.",
            "قلبت را با عشق پر کن.",
            "با هر شکست، یک قدم به موفقیت نزدیک‌تر می‌شوی.",
            "آرزوهایت را جدی بگیر.",
            "به خودت افتخار کن.",
            "هر روزت، فرصتی برای ارائه نسخه بهتر خودت است.",
            "اراده و پشتکار، اکسیر جادویی موفقیت است.",
            "به جای نگرانی، قدم بردار.",
            "افکارت را زیبا کن تا زندگی‌ات زیبا شود.",
            "از تغییر نترس، تغییر یعنی زندگی.",
            "تو بهترین الگوی خودت هستی.",
            "همیشه مهربان باش، حتی در سختی.",
            "با یک نگاه مثبت، دنیا زیباتر می‌شود.",
            "بهترین جمله‌ها را برای دل خودت بساز."
        ];

        const quoteElement = document.getElementById('quote-text');

        // تابع تغییر جمله
        function getNewQuote() {
            quoteElement.style.opacity = 0;
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * quotes.length);
                quoteElement.innerText = quotes[randomIndex];
                quoteElement.style.opacity = 1;
            }, 300);
        }

        // تابع کپی
        function copyQuote() {
            const text = document.getElementById('quote-text').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('جمله با موفقیت کپی شد! ✅');
            }).catch(err => {
                alert('خطا در کپی کردن متن');
            });
        }

        // تابع اشتراک‌گذاری
        function shareQuote() {
            const text = document.getElementById('quote-text').innerText;
            if (navigator.share) {
                navigator.share({
                    title: 'انگیزه روزانه',
                    text: text,
                }).catch((error) => console.log('خطا در اشتراک گذاری', error));
            } else {
                alert('مرورگر شما از قابلیت اشتراک‌گذاری پشتیبانی نمی‌کند. از دکمه کپی استفاده کنید.');
            }
        }

        // اجرای اولیه
        window.onload = getNewQuote;

        // کدهای تغییر تم (حالت شب و روز)
        const themeToggleBtn = document.getElementById('theme-toggle');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggleBtn.innerText = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                themeToggleBtn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeToggleBtn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });

        // ثبت Service Worker برای کارکرد آفلاین
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => console.log('ServiceWorker registered'))
                .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
